services:
  - type: web
    name: trainflow-tms
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    # package-lock.json is now committed, so this install is reproducible: it no longer
    # resolves fresh from the registry, which is what used to let an upstream bump break
    # a build that worked yesterday. Prisma must generate before `next build`, since the
    # build imports the client while collecting page data.
    #
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies, but @tailwindcss/postcss, tailwindcss and typescript all
    # live there and are needed to build.
    #
    # --legacy-peer-deps is retained because some peer ranges in this tree still
    # conflict (e.g. @hookform/resolvers' valibot peer).
    #
    # The seed runs as its own step rather than inside `npm run build`: it writes to
    # db/custom.db, which is tracked in git, so folding it into the build meant every
    # local `npm run build` mutated a committed file.
    #
    # `prisma db push` runs before the seed so a schema change that landed in git after
    # db/custom.db was last committed still gets applied. Without it, a new table (e.g.
    # ReportExecutionFile) would be missing at runtime and every report run would fail.
    buildCommand: npm install --include=dev --legacy-peer-deps && npx prisma generate && npx prisma db push --skip-generate && npm run seed:deploy && npm run build
    startCommand: node .next/standalone/server.js

    # The app has no /login route; the root page is the entry point.
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # Next's standalone server binds to HOSTNAME and PORT. Render supplies PORT
      # and requires the process to listen on 0.0.0.0, not localhost.
      - key: HOSTNAME
        value: 0.0.0.0

      # Absolute path on purpose. Prisma resolves a relative sqlite path against
      # the generated schema inside node_modules/.prisma/client, not the cwd, so
      # `file:./db/custom.db` would point somewhere unintended from the
      # standalone server.
      #
      # The free plan has no persistent disk: this file is the seeded copy baked
      # in from git, and any writes are lost when the instance sleeps or
      # redeploys. That resets the demo to its seeded state, which is intended.
      - key: DATABASE_URL
        value: file:/opt/render/project/src/db/custom.db

      # Set these in the Render dashboard; never commit them. JWT_SECRET must be
      # at least 32 characters or the process refuses to boot (src/lib/auth/jwt.ts).
      - key: JWT_SECRET
        sync: false

      - key: SCHEDULER_SECRET
        sync: false

      # The seed refuses to create the super admin unless both of these are set —
      # deliberately, so that a default password can never ship to production again.
      - key: SUPER_ADMIN_EMAIL
        sync: false

      - key: SUPER_ADMIN_PASSWORD
        sync: false

      # Encrypts secret Setting values (currently the SMTP password) at rest.
      # Deliberately separate from JWT_SECRET so rotating sessions doesn't break email.
      - key: SETTINGS_SECRET_KEY
        sync: false

      # Absolute base URL used to build the QR check-in and certificate verification
      # links that get printed on PDFs, where no Origin header is available.
      - key: APP_URL
        value: https://trainflow-tms.onrender.com

      # ─── AI Copilot Provider ───
      # If OPENAI_API_KEY is not set, the AI assistant returns a graceful
      # "not configured" message instead of crashing. The provider uses
      # native fetch — no SDK dependency.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
