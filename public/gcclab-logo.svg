<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- GCCLAB Official Logo — Color version (for light backgrounds) -->
  <defs>
    <linearGradient id="gcclab-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B2433"/>
      <stop offset="100%" stop-color="#6B1825"/>
    </linearGradient>
  </defs>

  <!-- Icon: burgundy rounded square with white G -->
  <rect x="4" y="12" width="56" height="56" rx="12" fill="url(#gcclab-grad)"/>
  <rect x="4" y="12" width="56" height="56" rx="12" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Stylized G (calibration gauge inspired) -->
  <path d="M22 30 h14 c8 0 14 6 14 14 v0 c0 8 -6 14 -14 14 h-14"
        stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="22" cy="44" r="4" fill="#fff"/>

  <!-- Wordmark -->
  <text x="72" y="42" font-family="Inter, 'IBM Plex Sans Arabic', sans-serif"
        font-size="26" font-weight="800" fill="#7B1E2B" letter-spacing="1">GCCLAB</text>
  <text x="72" y="60" font-family="Inter, 'IBM Plex Sans Arabic', sans-serif"
        font-size="9.5" font-weight="600" fill="#6B1825" letter-spacing="3" opacity="0.85">GULF CALIBRATION LAB</text>
</svg>
