  <rect x="4" y="12" width="56" height="56" rx="12" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.95"/>
  <rect x="4" y="12" width="56" height="56" rx="12" fill="#fff" fill-opacity="0.08"/>

